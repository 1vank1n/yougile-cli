[project]
name = "yougile-cli"
dynamic = ["version"]
description = "Консольный клиент для REST API YouGile v2 в стиле GitHub CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ivan Lukyanets", email = "lukyanets.ivan@gmail.com" }]
keywords = ["yougile", "cli", "kanban", "task-manager", "rest-api", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    # 0.26 is the first release that vendors click as `typer._click`, which the
    # Russian UI patches; older releases silently fall back to English or crash.
    "typer>=0.26,<0.28",
    "httpx>=0.27",
    "rich>=13",
    "platformdirs>=4",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/1vank1n/yougile-cli"
Repository = "https://github.com/1vank1n/yougile-cli"
Issues = "https://github.com/1vank1n/yougile-cli/issues"
Changelog = "https://github.com/1vank1n/yougile-cli/blob/main/CHANGELOG.md"

[project.scripts]
yougile = "yougile_cli.cli:main"
yg = "yougile_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/yougile_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yougile_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/docs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# typer requires typer.Option()/Argument() calls in parameter defaults
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:yougile_cli.*"]

[tool.mypy]
python_version = "3.11"
files = ["src/yougile_cli"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/yougile_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
