name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # The build runs first so the tag is compared against the version baked into
      # the wheel, not against the source tree the wheel is merely derived from.
      # The upload hands `publish` exactly these artifacts: rebuilding there would
      # produce a second wheel that neither the tag check nor the tests ever saw.
      - name: Build and verify distribution
        id: dist
        uses: ./.github/actions/build-and-verify
        with:
          artifact-name: dist
      - name: Tag matches the version in the built wheel
        env:
          WHEEL_VERSION: ${{ steps.dist.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$WHEEL_VERSION" ]; then
            echo "the built wheel reported no version" >&2
            exit 1
          fi
          if [ "$tag" != "$WHEEL_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match wheel version $WHEEL_VERSION" >&2
            exit 1
          fi
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Not `dist/*`: uv leaves a `.gitignore` in the build directory, and the
          # action's globber matches dotfiles, so it shipped as `default.gitignore`.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  # A job of its own: the OIDC token is minted per job, so keeping the build,
  # the tests and the third-party actions out of this one leaves nothing else
  # able to release the package under the project's name.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release whose upload already succeeded must not go red.
          skip-existing: true
