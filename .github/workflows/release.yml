name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import yougile_cli; print(yougile_cli.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet dist/*.whl
          YOUGILE_CONFIG_DIR="$(mktemp -d)" /tmp/relcheck/bin/yougile --version
          YOUGILE_CONFIG_DIR="$(mktemp -d)" /tmp/relcheck/bin/yg --help
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
