name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # The build runs first so the tag is compared against the version baked into
      # the wheel, not against the source tree the wheel is merely derived from.
      # `files: dist/*` below already publishes these artifacts, so no upload here.
      - name: Build and verify distribution
        id: dist
        uses: ./.github/actions/build-and-verify
        with:
          artifact-name: ""
      - name: Tag matches the version in the built wheel
        env:
          WHEEL_VERSION: ${{ steps.dist.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$WHEEL_VERSION" ]; then
            echo "the built wheel reported no version" >&2
            exit 1
          fi
          if [ "$tag" != "$WHEEL_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match wheel version $WHEEL_VERSION" >&2
            exit 1
          fi
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
